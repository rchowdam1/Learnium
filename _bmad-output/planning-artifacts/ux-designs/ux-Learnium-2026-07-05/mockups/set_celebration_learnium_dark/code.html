<div class="absolute inset-0 bg-black/80 backdrop-blur-sm z-0"></div>
<!-- Floating Card -->
<main class="relative z-10 w-full max-w-[420px] mx-margin-mobile md:mx-auto">
<div class="bg-surface-container-low border border-outline rounded-xl p-xl flex flex-col items-center text-center ambient-shadow transform transition-transform duration-300 scale-100 hover:scale-[1.02]">

<div class="bg-surface border border-outline rounded-lg p-md flex flex-col items-center justify-center glow-effect">

<div class="font-data-tabular text-data-tabular text-primary">250 XP</div>
<div class="font-label-ui text-label-ui text-on-surface-variant mt-xs">Earned</div>

<button class="mt-sm text-on-surface-variant font-label-ui text-label-ui hover:text-primary transition-colors py-xs">
                Back to Learn
            </button>
