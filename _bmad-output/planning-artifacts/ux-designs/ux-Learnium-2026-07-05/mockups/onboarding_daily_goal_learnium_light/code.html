<style type="text/tailwindcss">
        @layer utilities {
            /* Custom radio button styles based on Style Guidance */
            .radio-custom:checked + div {
                @apply bg-primary border-primary;
                box-shadow: inset 0 0 0 1px white;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface font-body-main min-h-screen flex flex-col relative antialiased selection:bg-secondary-fixed-dim selection:text-on-secondary-fixed">
<!-- Mobile Container (Max width for centered view on desktop) -->
<div class="w-full max-w-md mx-auto min-h-screen flex flex-col relative bg-surface-container-lowest shadow-none md:shadow-2xl md:shadow-primary/5">
<!-- Top Header / Progress Indicator -->
<header class="w-full px-margin-mobile pt-xs pb-sm flex items-center justify-between z-10 bg-surface-container-lowest sticky top-0 h-16">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary active:scale-95">
<span class="material-symbols-outlined" data-weight="regular">arrow_back</span>
</button>
<!-- Progress Bar: Thin 4px track, Navy to Lime gradient -->
<div class="flex-1 max-w-[120px] h-[4px] bg-surface-variant rounded-full overflow-hidden mx-4">
<div class="h-full w-1/2 bg-gradient-to-r from-primary to-secondary-fixed-dim rounded-full"></div>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pt-lg pb-32 flex flex-col">
<div class="mb-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Pick your pace.</h1>
<p class="font-body-main text-body-main text-on-surface-variant mt-sm">Choose a daily goal that fits your schedule. You can always change this later in settings.</p>
</div>
<!-- Options Stack -->
<form class="space-y-sm flex flex-col" id="goal-form">
<!-- Casual Tier -->
<label class="relative block w-full group cursor-pointer">
<input class="peer sr-only radio-custom" name="daily_goal" type="radio" value="casual"/>
<div class="w-full p-lg bg-surface border border-outline rounded-DEFAULT transition-all duration-200 ease-in-out group-hover:border-primary peer-checked:border-primary peer-checked:bg-surface-container-lowest flex items-center justify-between">
<div class="flex flex-col gap-xs">
<span class="font-label-ui text-label-ui text-primary uppercase tracking-widest">Casual</span>
<div class="flex items-baseline gap-1">
<span class="font-data-tabular text-data-tabular text-primary">10 XP</span>
<span class="font-body-main text-sm text-on-surface-variant">/day</span>
</div>
</div>
<!-- Radio indicator -->
<div class="w-6 h-6 rounded-full border border-outline flex items-center justify-center transition-all duration-200 pointer-events-none"></div>
</div>
</label>
<!-- Regular Tier (Pre-selected) -->
<label class="relative block w-full group cursor-pointer">
<input checked="" class="peer sr-only radio-custom" name="daily_goal" type="radio" value="regular"/>
<div class="w-full p-lg bg-surface border border-outline rounded-DEFAULT transition-all duration-200 ease-in-out group-hover:border-primary peer-checked:border-primary peer-checked:bg-surface-container-lowest flex items-center justify-between">
<div class="flex flex-col gap-xs">
<span class="font-label-ui text-label-ui text-primary uppercase tracking-widest">Regular</span>
<div class="flex items-baseline gap-1">
<span class="font-data-tabular text-data-tabular text-primary">20 XP</span>
<span class="font-body-main text-sm text-on-surface-variant">/day</span>
</div>
</div>
<!-- Radio indicator -->
<div class="w-6 h-6 rounded-full border border-outline flex items-center justify-center transition-all duration-200 pointer-events-none"></div>
</div>
</label>
<!-- Serious Tier -->
<label class="relative block w-full group cursor-pointer">
<input class="peer sr-only radio-custom" name="daily_goal" type="radio" value="serious"/>
<div class="w-full p-lg bg-surface border border-outline rounded-DEFAULT transition-all duration-200 ease-in-out group-hover:border-primary peer-checked:border-primary peer-checked:bg-surface-container-lowest flex items-center justify-between">
<div class="flex flex-col gap-xs">
<span class="font-label-ui text-label-ui text-primary uppercase tracking-widest">Serious</span>
<div class="flex items-baseline gap-1">
<span class="font-data-tabular text-data-tabular text-primary">50 XP</span>
<span class="font-body-main text-sm text-on-surface-variant">/day</span>
</div>
</div>
<!-- Radio indicator -->
<div class="w-6 h-6 rounded-full border border-outline flex items-center justify-center transition-all duration-200 pointer-events-none"></div>
</div>
</label>
</form>
</main>
<!-- Bottom Fixed CTA -->
<div class="fixed bottom-0 w-full max-w-md bg-surface-container-lowest px-margin-mobile pb-margin-mobile pt-sm z-50">
<!-- Fade masking for scrolling content if needed -->
<div class="absolute top-0 left-0 w-full h-8 -translate-y-full bg-gradient-to-t from-surface-container-lowest to-transparent pointer-events-none"></div>
<button class="w-full h-[56px] bg-primary text-on-primary rounded-DEFAULT flex items-center justify-center gap-xs font-label-ui text-label-ui uppercase tracking-widest hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all duration-200 ease-in-out shadow-none" type="button">
                Start learning
            </button>
</div>
</div>
