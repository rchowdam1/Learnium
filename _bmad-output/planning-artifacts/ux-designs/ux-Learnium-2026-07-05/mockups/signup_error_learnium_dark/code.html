<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Learnium - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb95f",
                        "outline": "#73777c",
                        "tertiary": "#1e0f00",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9ff",
                        "secondary-container": "#acf847",
                        "on-surface": "#181c21",
                        "primary-container": "#142937",
                        "on-primary-container": "#7c91a2",
                        "secondary-fixed": "#acf847",
                        "on-secondary-fixed": "#102000",
                        "tertiary-container": "#3a2200",
                        "inverse-on-surface": "#eef1f8",
                        "on-surface-variant": "#43474b",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#2a1700",
                        "background": "#f8f9ff",
                        "on-primary-fixed-variant": "#354958",
                        "surface-container-low": "#f1f3fb",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e0e2ea",
                        "surface-tint": "#4c6171",
                        "primary": "#001421",
                        "on-secondary-fixed-variant": "#304f00",
                        "secondary": "#416900",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d0e5f8",
                        "surface-container": "#ebeef5",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#b4c9dc",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#91db2a",
                        "tertiary-fixed": "#ffddb8",
                        "on-tertiary-container": "#c77e00",
                        "on-primary-fixed": "#071e2b",
                        "on-error-container": "#93000a",
                        "on-background": "#181c21",
                        "inverse-primary": "#b4c9dc",
                        "surface-container-high": "#e5e8f0",
                        "on-tertiary-fixed-variant": "#653e00",
                        "inverse-surface": "#2d3136",
                        "on-secondary-container": "#457000",
                        "surface-dim": "#d7dae1",
                        "outline-variant": "#c3c7cc",
                        "surface-container-highest": "#e0e2ea",
                        "custom-black": "#000000",
                        "custom-card": "#0C1116",
                        "custom-border": "#1C2530",
                        "custom-error": "#F87171"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "base": "4px",
                        "gutter": "24px",
                        "lg": "24px",
                        "md": "16px",
                        "xxl": "48px",
                        "container-max": "1200px",
                        "sm": "12px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Space Grotesk"],
                        "display-lg-mobile": ["Bricolage Grotesque"],
                        "body-main": ["Inter"],
                        "display-lg": ["Bricolage Grotesque"],
                        "headline-md": ["Bricolage Grotesque"],
                        "label-ui": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "data-tabular": ["18px", { "lineHeight": "1", "fontWeight": "700" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-main": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-ui": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-custom-black min-h-screen flex items-center justify-center p-margin-mobile font-body-main text-on-primary">
<main class="w-full max-w-[440px] bg-custom-card border border-custom-border rounded-xl p-xl shadow-2xl relative overflow-hidden flex flex-col items-center">
<!-- Logo -->
<div class="mb-lg">
<img alt="Learnium Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtQkp1rw6D1TiQYd9kKBvMbev7SVmNprc5P_woFbRRJ0bKrsNejFem8m2FXrcokJ_So9ISrkkaK469DoqNjsgsnGMr0hF59Z8e63-LEAYIpik89rA3ETqECBh6Lr1zBTpUX4sHAbACbyRJR7S64nVU5zFhotxREyvRzz7BGmQogBEK1AzjgkpirjoWDfzv9w8zsjB-MpWRTXVg7gvwusoFZ_Kz4dkr_ZtcfACOEPH_7d76yLpFRI7yktTE"/>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-center text-on-primary mb-xl w-full">Create your account</h1>
<!-- Form -->
<form class="w-full flex flex-col gap-lg">
<!-- Email Field -->
<div class="flex flex-col gap-xs w-full">
<label class="font-label-ui text-label-ui text-outline-variant" for="email">Email</label>
<input class="w-full bg-surface-container-highest/10 border border-custom-border rounded text-on-primary px-sm py-sm focus:outline-none focus:border-tertiary-fixed-dim transition-colors font-body-main text-body-main" id="email" placeholder="Enter your email" type="email" value="smart.friend@example.com"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs w-full">
<label class="font-label-ui text-label-ui text-outline-variant" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-highest/10 border border-custom-border rounded text-on-primary px-sm py-sm focus:outline-none focus:border-tertiary-fixed-dim transition-colors font-body-main text-body-main pr-10" id="password" placeholder="Create a password" type="password" value="••••••••••••"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline-variant cursor-pointer text-sm">visibility_off</span>
</div>
</div>
<!-- Date of Birth Field (Error State) -->
<div class="flex flex-col gap-xs w-full">
<label class="font-label-ui text-label-ui text-custom-error" for="dob">Date of Birth</label>
<input class="w-full bg-surface-container-highest/10 border border-custom-error rounded text-on-primary px-sm py-sm focus:outline-none focus:ring-1 focus:ring-custom-error font-body-main text-body-main date-input-dark" id="dob" type="date" value="2010-05-14"/>
<!-- Error Message -->
<div class="flex items-start gap-sm mt-xs">
<span class="material-symbols-outlined text-custom-error text-[18px] shrink-0 mt-1" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-main text-[14px] leading-[1.4] text-custom-error">Nice try, but Learnium is for the 16+ crowd. Come back when you've seen a bit more of the world.</p>
</div>
</div>
<!-- Submit Button (Disabled State) -->
<button class="mt-md w-full bg-surface-container-highest/20 text-on-surface-variant font-label-ui text-label-ui py-sm px-lg rounded flex items-center justify-center gap-xs cursor-not-allowed border border-custom-border opacity-50" disabled="" type="button">
                Create account
            </button>
<!-- Secondary Action -->
<div class="text-center mt-sm">
<p class="font-body-main text-[14px] text-outline-variant">Already have an account? <a class="text-on-primary hover:text-tertiary-fixed-dim transition-colors underline font-label-ui" href="#">Log in</a></p>
</div>
</form>
</main>
<style>
        /* Hide calendar icon in WebKit for custom styling */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</body></html>
