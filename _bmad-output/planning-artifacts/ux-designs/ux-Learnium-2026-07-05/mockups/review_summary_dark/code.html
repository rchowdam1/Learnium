<body class="bg-primary text-on-primary min-h-screen flex items-center justify-center font-body-main text-body-main selection:bg-secondary-fixed selection:text-primary overflow-hidden relative">
<!-- Decorative background elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container rounded-full blur-[120px] opacity-50 mix-blend-screen"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-tertiary-fixed-dim rounded-full blur-[100px] opacity-20 mix-blend-screen"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[600px] px-margin-mobile md:px-gutter relative z-10">
<!-- Summary Card -->
<div class="bg-surface-dim border border-outline rounded-xl p-lg md:p-xl shadow-[0_20px_40px_rgba(0,20,33,0.3)] backdrop-blur-sm relative overflow-hidden">
<!-- Subtle glow effect inside card -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-secondary-fixed rounded-full blur-[60px] opacity-20"></div>
<div class="flex flex-col items-center text-center space-y-xl">
<!-- Headline -->
<div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary-fixed mb-xs">Session Complete</h1>
<p class="font-body-main text-body-main text-surface-variant">You've successfully finished your review.</p>
</div>
<!-- XP Banner -->
<div class="flex items-center gap-sm bg-primary-container border border-outline py-sm px-lg rounded-full">
<span class="material-symbols-outlined text-secondary-fixed" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-data-tabular text-data-tabular text-on-primary">XP Earned: +25</span>
</div>
<!-- Streak Banner -->
<div class="w-full bg-tertiary-container border border-tertiary-fixed-dim rounded-lg p-md flex items-center justify-between group cursor-pointer transition-colors hover:bg-[#4a2b00]">
<div class="flex items-center gap-md">
<!-- North Star Logo representation -->
<div class="w-10 h-10 bg-tertiary-fixed-dim rounded-sm rotate-45 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined -rotate-45 text-tertiary-container" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="text-left">
<h3 class="font-label-ui text-label-ui text-tertiary-fixed">STREAK SAVED</h3>
<p class="font-data-tabular text-data-tabular text-on-primary mt-base">Day 12</p>
</div>
</div>
<span class="material-symbols-outlined text-tertiary-fixed opacity-50 group-hover:opacity-100 transition-opacity">chevron_right</span>
</div>

<button class="w-full bg-on-primary text-primary font-label-ui text-label-ui py-md px-lg rounded-DEFAULT hover:bg-surface-variant transition-colors active:scale-[0.98]">
