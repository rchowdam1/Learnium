<style>
        /* Ambient shadow for the dark card */
        .ambient-shadow {
            box-shadow: 0 20px 40px -10px rgba(0, 20, 33, 0.4);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-dim dark:bg-[#080b0f] min-h-screen flex items-center justify-center p-lg font-body-main antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Share Card Container -->
<main class="w-full max-w-[400px]">
<!-- The Card -->
<article class="bg-[#0b0e14] border border-outline/20 rounded-[24px] p-xl flex flex-col items-center text-center ambient-shadow relative overflow-hidden group">
<!-- Subtle background glow -->
<div class="absolute inset-0 bg-gradient-to-br from-secondary-container/5 via-transparent to-transparent opacity-50"></div>
<!-- Top Section: Brand & Context -->
<header class="w-full flex justify-between items-center mb-xl relative z-10">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-secondary-fixed text-[20px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-headline-md text-headline-md text-on-surface dark:text-surface-container-lowest tracking-tight">Learnium</span>
</div>
<div class="px-sm py-xs rounded-full border border-outline/30 bg-surface-container-lowest/5">
<span class="font-label-ui text-label-ui text-outline-variant">Milestone Reached</span>
</div>
</header>
<!-- Center Section: The Badge & Mascot -->
<section class="mb-lg relative z-10 w-full flex flex-col items-center">
<!-- Nova Starburst Graphic Container -->
<div class="relative w-[180px] h-[180px] flex items-center justify-center mb-lg">
<!-- Geometric structural rays (Nova representation) -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-full h-[1px] bg-secondary-fixed/40 rotate-0"></div>
<div class="w-full h-[1px] bg-secondary-fixed/40 rotate-45 absolute"></div>
<div class="w-full h-[1px] bg-secondary-fixed/40 rotate-90 absolute"></div>
<div class="w-full h-[1px] bg-secondary-fixed/40 rotate-135 absolute"></div>
<!-- Inner ring -->
<div class="absolute w-[120px] h-[120px] rounded-full border border-secondary-fixed/30 border-dashed animate-[spin_30s_linear_infinite]"></div>
</div>
<!-- Core Badge -->
<div class="w-[100px] h-[100px] bg-secondary-fixed text-on-secondary-fixed flex flex-col items-center justify-center rounded-2xl rotate-45 shadow-[0_0_30px_rgba(172,248,71,0.3)] transition-transform duration-500 group-hover:scale-105">
<div class="-rotate-45 flex flex-col items-center">
<span class="font-label-ui text-label-ui opacity-80 uppercase tracking-widest mb-1">Level</span>
<span class="font-display-lg-mobile text-display-lg-mobile leading-none">6</span>
</div>
</div>
</div>
<!-- Primary Announcement -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-surface-container-lowest mb-xs max-w-[280px] leading-tight">
                    Priya reached <br/>
<span class="text-secondary-fixed">Level 6</span> <br/>
                    on Learnium
                </h1>
</section>
<!-- Bottom Section: Stats -->
<footer class="w-full pt-lg border-t border-outline/20 relative z-10 flex flex-col gap-md">
<div class="flex justify-center items-center gap-md">
<!-- Streak Stat -->
<div class="flex items-center gap-xs bg-tertiary-container/30 px-md py-sm rounded-lg border border-tertiary-fixed-dim/20">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-[18px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-data-tabular text-data-tabular text-tertiary-fixed-dim">12-Day Streak</span>
</div>
<!-- Divider -->
<div class="w-[1px] h-[24px] bg-outline/30"></div>
<!-- XP Stat -->
<div class="flex items-center gap-xs">
<span class="font-data-tabular text-data-tabular text-surface-variant">4,250 Total XP</span>
</div>
</div>
</footer>
</article>
<!-- Action Buttons (Outside the shareable card area for UI context) -->
<div class="mt-lg flex gap-md justify-center">
<button class="bg-surface-container-lowest text-on-surface px-lg py-sm rounded-lg font-label-ui text-label-ui hover:bg-surface-variant transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">share</span>
                Share to Story
            </button>
<button class="bg-transparent border border-outline-variant text-surface-container-lowest px-lg py-sm rounded-lg font-label-ui text-label-ui hover:bg-surface-container-lowest/10 transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">download</span>
                Save
            </button>
</div>
