<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Review Session - Learnium</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#416900",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary-container": "#142937",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e2ea",
                        "surface-container-low": "#f1f3fb",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "surface": "#f8f9ff",
                        "secondary-fixed-dim": "#91db2a",
                        "surface-dim": "#d7dae1",
                        "tertiary-container": "#3a2200",
                        "on-secondary-container": "#457000",
                        "background": "#f8f9ff",
                        "surface-container-highest": "#e0e2ea",
                        "inverse-on-surface": "#eef1f8",
                        "outline": "#73777c",
                        "secondary-fixed": "#acf847",
                        "secondary-container": "#acf847",
                        "primary-fixed-dim": "#b4c9dc",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e5e8f0",
                        "on-tertiary-container": "#c77e00",
                        "outline-variant": "#c3c7cc",
                        "primary": "#001421",
                        "on-surface-variant": "#43474b",
                        "on-surface": "#181c21",
                        "surface-container": "#ebeef5",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary-fixed-variant": "#304f00",
                        "on-secondary-fixed": "#102000",
                        "inverse-primary": "#b4c9dc",
                        "on-primary-container": "#7c91a2",
                        "surface-bright": "#f8f9ff",
                        "on-primary-fixed-variant": "#354958",
                        "on-background": "#181c21",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#071e2b",
                        "primary-fixed": "#d0e5f8",
                        "surface-tint": "#4c6171",
                        "tertiary": "#1e0f00",
                        "inverse-surface": "#2d3136"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "4px",
                        "sm": "12px",
                        "lg": "24px",
                        "xxl": "48px",
                        "xs": "8px",
                        "md": "16px",
                        "xl": "32px",
                        "container-max": "1200px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-main": ["Inter"],
                        "label-ui": ["Space Grotesk"],
                        "display-lg-mobile": ["Bricolage Grotesque"],
                        "display-lg": ["Bricolage Grotesque"],
                        "data-tabular": ["Space Grotesk"],
                        "headline-md": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "body-main": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-ui": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "data-tabular": ["18px", { "lineHeight": "1", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #121212; /* Fallback for absolute dark */
        }
        .dark .app-bg {
            background-color: #0d1117; /* Deep midnight ink style */
        }
        .dark .card-surface {
            background-color: #161b22;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="app-bg text-on-surface dark:text-inverse-on-surface h-screen flex flex-col font-body-main antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full flex justify-between items-center px-gutter h-16 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flat no shadows z-50">
<button aria-label="close" class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">Review Session</h1>
<button aria-label="settings" class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col pt-24 pb-32 px-gutter max-w-container-max mx-auto w-full">
<!-- Progress Bar (Dots) -->
<div aria-label="Progress: 3 out of 10" class="flex justify-center items-center gap-2 mb-xl w-full max-w-md mx-auto">
<!-- Active/Completed Dots -->
<div class="h-2 w-8 rounded-full bg-gradient-to-r from-primary to-secondary-fixed"></div>
<div class="h-2 w-8 rounded-full bg-gradient-to-r from-primary to-secondary-fixed"></div>
<div class="h-2 w-8 rounded-full bg-gradient-to-r from-primary to-secondary-fixed"></div>
<!-- Incomplete Dots -->
<div class="h-2 w-2 rounded-full bg-surface-container-high dark:bg-surface-container-highest"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-high dark:bg-surface-container-highest"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-high dark:bg-surface-container-highest"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-high dark:bg-surface-container-highest"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-high dark:bg-surface-container-highest"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-high dark:bg-surface-container-highest"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-high dark:bg-surface-container-highest"></div>
</div>
<!-- Question Card -->
<div class="card-surface border border-outline-variant dark:border-outline rounded-xl p-lg md:p-xxl flex-grow flex flex-col justify-center items-center text-center shadow-sm relative overflow-hidden max-w-2xl mx-auto w-full">
<!-- Subtle accent glow -->
<div class="absolute top-0 left-0 w-full h-1 bg-secondary-fixed opacity-50"></div>
<span class="font-label-ui text-label-ui text-secondary-fixed mb-sm tracking-widest uppercase">System Design</span>
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary dark:text-inverse-on-surface mb-xl">
                What is the primary benefit of horizontal scaling?
            </h2>
<!-- Options (Reveal State) -->
<div class="w-full flex flex-col gap-sm">
<!-- Incorrect Option -->
<button class="w-full text-left p-md border border-outline-variant dark:border-outline rounded-lg bg-surface dark:bg-inverse-surface opacity-50 cursor-not-allowed flex items-center justify-between" disabled="">
<span class="font-body-main text-body-main">Upgrading hardware components on a single server</span>
<span class="material-symbols-outlined text-outline" data-icon="close">close</span>
</button>
<!-- Correct Option (Highlighted) -->
<div class="w-full text-left p-md border border-secondary-fixed rounded-lg bg-primary-container dark:bg-primary text-on-primary-container dark:text-inverse-on-surface flex items-center justify-between relative overflow-hidden group">
<!-- Glow effect for correct answer -->
<div class="absolute inset-0 bg-secondary-fixed/10 pointer-events-none"></div>
<span class="font-body-main text-body-main relative z-10 font-bold">Adding more machines to distribute the load</span>
<span class="material-symbols-outlined text-secondary-fixed relative z-10" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Another Incorrect Option -->
<button class="w-full text-left p-md border border-outline-variant dark:border-outline rounded-lg bg-surface dark:bg-inverse-surface opacity-50 cursor-not-allowed flex items-center justify-between" disabled="">
<span class="font-body-main text-body-main">Reducing latency by moving servers closer to users</span>
<span class="material-symbols-outlined text-outline" data-icon="close">close</span>
</button>
</div>
</div>
</main>
<!-- Bottom Action Area (Reveal State) -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline p-gutter z-40">
<div class="max-w-2xl mx-auto flex flex-col gap-sm">
<!-- Correct Banner -->
<div class="flex items-center gap-xs text-secondary-fixed font-label-ui text-label-ui mb-xs">
<span class="material-symbols-outlined" data-icon="bolt" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span>Nailed it! +10 XP</span>
</div>
<div class="flex gap-md w-full">
<button class="flex-1 py-md px-lg rounded-lg border border-outline dark:border-outline-variant bg-transparent font-label-ui text-label-ui text-primary dark:text-inverse-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-center">
                    Review Again Later
                </button>
<button class="flex-1 py-md px-lg rounded-lg bg-secondary-fixed text-on-secondary-fixed font-label-ui text-label-ui hover:opacity-90 transition-opacity active:scale-95 duration-150 text-center shadow-[0_0_15px_rgba(172,248,71,0.2)]">
                    Next Question
                </button>
</div>
</div>
</div>
</body></html>
