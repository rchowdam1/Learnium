<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Learnium - Signup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400..700&amp;family=Space+Grotesk:wght@400..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb95f",
                        "outline": "#73777c",
                        "tertiary": "#1e0f00",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9ff",
                        "secondary-container": "#acf847",
                        "on-surface": "#181c21",
                        "primary-container": "#142937",
                        "on-primary-container": "#7c91a2",
                        "secondary-fixed": "#acf847",
                        "on-secondary-fixed": "#102000",
                        "tertiary-container": "#3a2200",
                        "inverse-on-surface": "#eef1f8",
                        "on-surface-variant": "#43474b",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#2a1700",
                        "background": "#f8f9ff",
                        "on-primary-fixed-variant": "#354958",
                        "surface-container-low": "#f1f3fb",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e0e2ea",
                        "surface-tint": "#4c6171",
                        "primary": "#001421",
                        "on-secondary-fixed-variant": "#304f00",
                        "secondary": "#416900",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d0e5f8",
                        "surface-container": "#ebeef5",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#b4c9dc",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#91db2a",
                        "tertiary-fixed": "#ffddb8",
                        "on-tertiary-container": "#c77e00",
                        "on-primary-fixed": "#071e2b",
                        "on-error-container": "#93000a",
                        "on-background": "#181c21",
                        "inverse-primary": "#b4c9dc",
                        "surface-container-high": "#e5e8f0",
                        "on-tertiary-fixed-variant": "#653e00",
                        "inverse-surface": "#2d3136",
                        "on-secondary-container": "#457000",
                        "surface-dim": "#d7dae1",
                        "outline-variant": "#c3c7cc",
                        "surface-container-highest": "#e0e2ea"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "base": "4px",
                        "gutter": "24px",
                        "lg": "24px",
                        "md": "16px",
                        "xxl": "48px",
                        "container-max": "1200px",
                        "sm": "12px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Space Grotesk"],
                        "display-lg-mobile": ["Bricolage Grotesque"],
                        "body-main": ["Inter"],
                        "display-lg": ["Bricolage Grotesque"],
                        "headline-md": ["Bricolage Grotesque"],
                        "label-ui": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "data-tabular": ["18px", { "lineHeight": "1", "fontWeight": "700" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-main": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-ui": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-margin-mobile antialiased font-body-main text-on-surface">
<main class="w-full max-w-[480px]">
<div class="bg-surface border border-outline-variant rounded-lg p-xl flex flex-col gap-xl">
<header class="flex flex-col items-center text-center gap-md">
<img alt="Learnium Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtQkp1rw6D1TiQYd9kKBvMbev7SVmNprc5P_woFbRRJ0bKrsNejFem8m2FXrcokJ_So9ISrkkaK469DoqNjsgsnGMr0hF59Z8e63-LEAYIpik89rA3ETqECBh6Lr1zBTpUX4sHAbACbyRJR7S64nVU5zFhotxREyvRzz7BGmQogBEK1AzjgkpirjoWDfzv9w8zsjB-MpWRTXVg7gvwusoFZ_Kz4dkr_ZtcfACOEPH_7d76yLpFRI7yktTE"/>
<div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary">Create your account</h1>
<p class="font-body-main text-body-main text-on-surface-variant mt-sm">Adult learning, evolved.</p>
</div>
</header>
<form class="flex flex-col gap-gutter">
<div class="flex flex-col gap-sm">
<label class="font-label-ui text-label-ui text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm font-body-main text-body-main text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-ui text-label-ui text-on-surface" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm font-body-main text-body-main text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-ui text-label-ui text-on-surface" for="dob">Date of Birth (Must be 16+)</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm font-body-main text-body-main text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="dob" required="" type="date"/>
</div>
<div class="flex items-start gap-sm mt-xs">
<input class="mt-1 w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="terms" required="" type="checkbox"/>
<label class="font-label-ui text-label-ui text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary underline hover:text-tertiary-fixed-dim transition-colors" href="#">Terms of Service</a> and <a class="text-primary underline hover:text-tertiary-fixed-dim transition-colors" href="#">Privacy Policy</a>.
                    </label>
</div>
<button class="w-full bg-primary-container text-on-tertiary font-label-ui text-label-ui rounded-lg p-md hover:bg-primary transition-colors flex items-center justify-center gap-sm mt-sm" type="submit">
                    Create account
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="flex items-center gap-md">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-ui text-label-ui text-outline">or</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-ui text-label-ui rounded-lg p-md hover:border-primary transition-colors flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">login</span>
                Continue with Google
            </button>
<p class="text-center font-label-ui text-label-ui text-on-surface-variant">
                Already have an account? <a class="text-primary underline hover:text-tertiary-fixed-dim transition-colors" href="#">Log in</a>
</p>
</div>
</main>
</body></html>
