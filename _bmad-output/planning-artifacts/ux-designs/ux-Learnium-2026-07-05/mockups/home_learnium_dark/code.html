<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Learnium - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Inter:wght@300..700&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "outline": "#73777c",
                        "background": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#304f00",
                        "surface-container-low": "#f1f3fb",
                        "on-secondary-fixed": "#102000",
                        "error": "#ba1a1a",
                        "surface-tint": "#4c6171",
                        "on-primary-fixed-variant": "#354958",
                        "primary-container": "#142937",
                        "on-primary-container": "#7c91a2",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary-container": "#3a2200",
                        "on-tertiary-container": "#c77e00",
                        "on-secondary-container": "#457000",
                        "surface-container-high": "#e5e8f0",
                        "surface-container": "#ebeef5",
                        "secondary": "#416900",
                        "on-surface": "#181c21",
                        "surface-dim": "#d7dae1",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e0e2ea",
                        "on-tertiary-fixed-variant": "#653e00",
                        "secondary-fixed": "#acf847",
                        "on-primary-fixed": "#071e2b",
                        "primary-fixed-dim": "#b4c9dc",
                        "outline-variant": "#c3c7cc",
                        "tertiary-fixed": "#ffddb8",
                        "inverse-on-surface": "#eef1f8",
                        "surface-variant": "#e0e2ea",
                        "primary": "#001421",
                        "on-surface-variant": "#43474b",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2d3136",
                        "inverse-primary": "#b4c9dc",
                        "secondary-fixed-dim": "#91db2a",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#2a1700",
                        "surface": "#f8f9ff",
                        "primary-fixed": "#d0e5f8",
                        "on-background": "#181c21",
                        "tertiary": "#1e0f00",
                        "secondary-container": "#acf847",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xxl": "48px",
                        "xs": "8px",
                        "xl": "32px",
                        "sm": "12px",
                        "md": "16px",
                        "margin-mobile": "16px",
                        "container-max": "1200px",
                        "gutter": "24px",
                        "lg": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Space Grotesk"],
                        "display-lg-mobile": ["Bricolage Grotesque"],
                        "display-lg": ["Bricolage Grotesque"],
                        "headline-md": ["Bricolage Grotesque"],
                        "body-main": ["Inter"],
                        "label-ui": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "data-tabular": ["18px", { "lineHeight": "1", "fontWeight": "700" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-main": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-ui": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #000000; color: #ffffff; }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-main text-body-main antialiased min-h-screen flex flex-col pt-16 pb-24">
<!-- TopAppBar -->
<header class="bg-surface-bright dark:bg-inverse-surface fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-xs text-primary dark:text-inverse-primary hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded p-1 active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-headline-md text-headline-md-mobile font-extrabold">Learnium</span>
</div>
<div class="flex items-center gap-md">
<div class="flex items-center gap-xs bg-tertiary-container border border-on-tertiary-container/30 px-3 py-1 rounded-full">
<span class="text-[#F59E0B] font-data-tabular text-data-tabular">12</span>
<span class="material-symbols-outlined text-[#F59E0B] text-sm" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div class="flex items-center gap-xs bg-secondary-container/20 border border-secondary-fixed-dim/30 px-3 py-1 rounded-full">
<span class="text-[#84CC16] font-data-tabular text-data-tabular">1.2k</span>
<span class="font-label-ui text-label-ui text-[#84CC16]">XP</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-margin-mobile max-w-container-max mx-auto w-full gap-xl py-lg">
<!-- Daily Goal Ring -->
<section class="w-full max-w-sm flex flex-col items-center gap-md">
<h2 class="font-headline-md text-headline-md-mobile text-inverse-primary self-start">Daily Goal</h2>
<div class="relative w-48 h-48">
<svg class="w-full h-full" viewbox="0 0 120 120">
<circle class="text-inverse-surface stroke-current" cx="60" cy="60" fill="transparent" r="54" stroke-width="8"></circle>
<circle class="text-[#84CC16] progress-ring__circle stroke-current" cx="60" cy="60" fill="transparent" r="54" stroke-dasharray="339.292" stroke-dashoffset="186.61" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-error">45%</span>
<span class="font-label-ui text-label-ui text-on-primary-container">completed</span>
</div>
</div>
</section>
<!-- Bento Layout -->
<section class="w-full grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Reviews Due Card -->
<div class="bg-inverse-surface border border-outline rounded-lg p-lg flex flex-col justify-between gap-md relative overflow-hidden group hover:border-[#84CC16] transition-colors">
<div class="absolute -right-8 -top-8 w-32 h-32 bg-[#F59E0B]/10 rounded-full blur-2xl group-hover:bg-[#F59E0B]/20 transition-all"></div>
<div>
<div class="flex items-center gap-sm mb-xs">
<span class="material-symbols-outlined text-[#F59E0B]">cycle</span>
<h3 class="font-headline-md text-headline-md-mobile text-on-error">Reviews due</h3>
</div>
<p class="text-on-primary-container font-label-ui text-label-ui">Keep your memory sharp.</p>
</div>
<div class="flex justify-between items-end mt-xl">
<div class="flex flex-col">
<span class="font-data-tabular text-data-tabular text-on-error text-3xl">24</span>
<span class="font-label-ui text-label-ui text-on-primary-container">cards</span>
</div>
<button class="bg-on-error text-primary px-6 py-3 rounded font-label-ui text-label-ui hover:bg-[#84CC16] hover:text-primary transition-colors">Start review</button>
</div>
</div>
<!-- Continue Learning Card -->
<div class="bg-inverse-surface border border-outline rounded-lg p-lg flex flex-col gap-md relative overflow-hidden group hover:border-inverse-primary transition-colors">
<div class="absolute -left-8 -bottom-8 w-32 h-32 bg-primary-fixed-dim/10 rounded-full blur-2xl group-hover:bg-primary-fixed-dim/20 transition-all"></div>
<h3 class="font-headline-md text-headline-md-mobile text-inverse-primary flex items-center gap-xs">
<span class="material-symbols-outlined">school</span>
                    Continue learning
                </h3>
<div class="bg-primary border border-outline-variant/30 rounded p-md mt-sm">
<h4 class="font-label-ui text-label-ui text-on-error mb-xs">System Design for Scale</h4>
<p class="text-on-primary-container text-sm mb-md">Module 3: Database Sharding Strategies</p>
<div class="w-full bg-inverse-surface h-1 rounded-full mb-md overflow-hidden">
<div class="bg-gradient-to-r from-primary-fixed-dim to-[#84CC16] h-full rounded-full w-[65%]"></div>
</div>
<div class="flex justify-end">
<button class="border border-[#84CC16] text-[#84CC16] bg-transparent hover:bg-[#84CC16]/10 px-4 py-2 rounded font-label-ui text-label-ui transition-colors">Resume</button>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden bg-surface-container-lowest dark:bg-surface-container-low fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline bg-surface-container-lowest fixed bottom-0 left-0 w-full flex justify-around items-center pt-2 pb-safe px-2 h-20">
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-4 py-1 active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-ui text-label-ui mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">menu_book</span>
<span class="font-label-ui text-label-ui mt-1">Learn</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">rebase_edit</span>
<span class="font-label-ui text-label-ui mt-1">Review</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">emoji_events</span>
<span class="font-label-ui text-label-ui mt-1">Leagues</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">person</span>
<span class="font-label-ui text-label-ui mt-1">Profile</span>
</button>
</nav>
</body></html>
