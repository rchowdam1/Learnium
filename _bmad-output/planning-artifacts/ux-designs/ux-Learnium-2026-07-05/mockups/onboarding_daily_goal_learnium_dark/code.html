<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Learnium - Pick Your Pace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed": "#ffddb8",
                      "inverse-on-surface": "#eef1f8",

                      "outline-variant": "#c3c7cc",
                      "primary": "#001421",
                      "on-surface-variant": "#43474b",
                      "error-container": "#ffdad6",
                      "surface-variant": "#e0e2ea",
                      "surface": "#f8f9ff",
                      "primary-fixed": "#d0e5f8",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed": "#2a1700",
                      "secondary-fixed-dim": "#91db2a",
                      "on-error": "#ffffff",
                      "inverse-surface": "#2d3136",
                      "inverse-primary": "#b4c9dc",
                      "secondary-container": "#acf847",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#1e0f00",
                      "on-background": "#181c21",
                      "surface-container-low": "#f1f3fb",
                      "on-secondary-fixed-variant": "#304f00",
                      "outline": "#73777c",
                      "background": "#f8f9ff",
                      "on-primary": "#ffffff",
                      "surface-bright": "#f8f9ff",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed-dim": "#ffb95f",
                      "tertiary-container": "#3a2200",
                      "primary-container": "#142937",
                      "on-primary-container": "#7c91a2",
                      "on-secondary-fixed": "#102000",
                      "error": "#ba1a1a",
                      "surface-tint": "#4c6171",
                      "on-primary-fixed-variant": "#354958",
                      "secondary": "#416900",
                      "on-surface": "#181c21",
                      "surface-container-high": "#e5e8f0",
                      "surface-container": "#ebeef5",
                      "on-secondary-container": "#457000",
                      "on-tertiary-container": "#c77e00",
                      "secondary-fixed": "#acf847",
                      "on-primary-fixed": "#071e2b",
                      "on-tertiary-fixed-variant": "#653e00",
                      "surface-dim": "#d7dae1",
                      "on-error-container": "#93000a",
                      "surface-container-highest": "#e0e2ea"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "24px",
                      "base": "4px",
                      "gutter": "24px",
                      "container-max": "1200px",
                      "md": "16px",
                      "margin-mobile": "16px",
                      "xl": "32px",
                      "sm": "12px",
                      "xxl": "48px",
                      "xs": "8px"
              },
              "fontFamily": {
                      "display-lg-mobile": ["Bricolage Grotesque"],

                      "body-main": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }]

            }
          }
        }
    </script>
<style>
        /* Base Material Symbols setup */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom card selection styles */
        .goal-card[data-selected="true"] {
            border-color: theme('colors.secondary-fixed-dim');
            background-color: theme('colors.secondary-fixed-dim' / 10%);
        }
        .goal-card[data-selected="true"] .radio-indicator {
            border-color: theme('colors.secondary-fixed-dim');
            background-color: theme('colors.secondary-fixed-dim');
        }
        .goal-card[data-selected="true"] .radio-indicator::after {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary text-on-primary min-h-screen flex flex-col font-body-main selection:bg-secondary-fixed-dim selection:text-primary">
<!-- Top App Bar (Minimal for Onboarding) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-50 bg-primary">
<button aria-label="Go back" class="flex items-center justify-center text-on-primary hover:bg-primary-container p-xs rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex gap-xs">
<div class="w-12 h-1 bg-secondary-fixed-dim rounded-full"></div>
<div class="w-12 h-1 bg-secondary-fixed-dim rounded-full"></div>
<div class="w-12 h-1 bg-outline-variant/30 rounded-full"></div>
</div>
<div class="w-8"></div> <!-- Spacer for flex balance -->
</header>
<main class="flex-1 flex flex-col px-margin-mobile py-xl md:px-gutter md:max-w-container-max md:mx-auto w-full max-w-md">
<!-- Headline Section -->
<div class="mb-xxl mt-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-primary tracking-tight">Pick your pace.</h1>
<p class="mt-md text-on-primary-container font-body-main text-body-main">Learning a language requires consistency. Choose a daily goal that fits your lifestyle.</p>
</div>
<!-- Options Container -->
<div class="flex flex-col gap-md flex-1">
<!-- Option 1: Casual -->
<button class="goal-card w-full flex items-center justify-between p-lg rounded-xl border border-outline bg-primary-container hover:border-on-primary-container transition-all duration-200 text-left group" data-selected="false">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-tint/20 flex items-center justify-center text-on-primary group-hover:bg-surface-tint/40 transition-colors">
<span class="material-symbols-outlined">coffee</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-primary">Casual</h2>
<div class="flex items-center gap-2 mt-base">
<span class="font-label-ui text-label-ui text-tertiary-fixed-dim">10 XP</span>
<span class="font-label-ui text-label-ui text-on-primary-container">/ day</span>
</div>
</div>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center transition-colors"></div>
</button>
<!-- Option 2: Regular -->
<button class="goal-card w-full flex items-center justify-between p-lg rounded-xl border border-outline bg-primary-container hover:border-on-primary-container transition-all duration-200 text-left group" data-selected="false">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-tint/20 flex items-center justify-center text-on-primary group-hover:bg-surface-tint/40 transition-colors">
<span class="material-symbols-outlined">directions_walk</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-primary">Regular</h2>
<div class="flex items-center gap-2 mt-base">
<span class="font-label-ui text-label-ui text-secondary-fixed-dim">20 XP</span>
<span class="font-label-ui text-label-ui text-on-primary-container">/ day</span>
</div>
</div>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center transition-colors"></div>
</button>
<!-- Option 3: Serious -->
<button class="goal-card w-full flex items-center justify-between p-lg rounded-xl border border-outline bg-primary-container hover:border-on-primary-container transition-all duration-200 text-left group" data-selected="false">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-tint/20 flex items-center justify-center text-on-primary group-hover:bg-surface-tint/40 transition-colors">
<span class="material-symbols-outlined">local_fire_department</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-primary">Serious</h2>
<div class="flex items-center gap-2 mt-base">
<span class="font-label-ui text-label-ui text-error-container">50 XP</span>
<span class="font-label-ui text-label-ui text-on-primary-container">/ day</span>
</div>
</div>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center transition-colors"></div>
</button>
</div>
<!-- Footer CTA -->
<div class="mt-auto pt-xl pb-lg w-full sticky bottom-0 bg-primary/90 backdrop-blur-sm">
<button class="w-full bg-on-primary text-primary font-label-ui text-label-ui py-md rounded-xl disabled:opacity-30 disabled:cursor-not-allowed transition-opacity duration-300 flex items-center justify-center gap-xs" disabled="" id="start-learning-btn">
                Start learning
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.goal-card');
            const ctaBtn = document.getElementById('start-learning-btn');
            
            // Pre-select the middle option (Regular) to reduce friction
            setTimeout(() => {
                if (cards.length > 1) {
                    selectCard(cards[1]);
                }
            }, 300);

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    selectCard(card);
                });
            });

            function selectCard(selectedCard) {
                // Deselect all
                cards.forEach(c => c.setAttribute('data-selected', 'false'));
                
                // Select clicked
                selectedCard.setAttribute('data-selected', 'true');
                
                // Enable CTA
                ctaBtn.disabled = false;
                
                // Add subtle bounce animation to button
                ctaBtn.classList.remove('scale-100');
                ctaBtn.classList.add('scale-95');
                setTimeout(() => {
                    ctaBtn.classList.remove('scale-95');
                    ctaBtn.classList.add('scale-100');
                }, 150);
            }
        });
    </script>
</body></html>
