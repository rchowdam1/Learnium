<body class="bg-surface-container-lowest font-body-main text-on-surface flex flex-col min-h-screen">
<!-- Top Area -->
<header class="sticky top-0 z-20 bg-surface-container-lowest/90 backdrop-blur-md border-b border-surface-variant px-margin-mobile py-sm">

<div class="flex items-center justify-between">
<span class="font-label-ui text-label-ui text-on-surface-variant uppercase tracking-wider">Lesson 3 of 8</span>
<span class="font-data-tabular text-data-tabular text-secondary-fixed-dim">40% Complete</span>

<div class="w-full bg-surface-variant h-2 rounded-full mt-sm overflow-hidden">
<div class="bg-secondary-fixed-dim h-full rounded-full transition-all duration-1000" style="width: 40%;"></div>
</div>

<path d="M 20% 240 Q 80% 320 80% 400" fill="none" stroke="#91db2a" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>

<path d="M 80% 400 Q 20% 480 20% 560" fill="none" stroke="#e0e2ea" stroke-dasharray="12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>

<path d="M 20% 560 Q 50% 640 50% 720" fill="none" stroke="#e0e2ea" stroke-dasharray="12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
</svg>
<div class="relative z-10 flex flex-col items-center gap-[100px] py-xl max-w-[400px] mx-auto w-full px-margin-mobile">
<!-- Lesson 1: Fundamentals (Completed) -->
<div class="w-full flex justify-center translate-x-0 relative group cursor-pointer">
<div class="absolute -top-8 bg-surface-container-high px-3 py-1 rounded-full text-xs font-label-ui text-on-surface opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-sm">Fundamentals</div>

<span class="material-symbols-outlined text-4xl text-on-secondary" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
<!-- Lesson 2: Horizontal Scaling (Completed) -->
<div class="w-full flex justify-start pl-8 relative group cursor-pointer">
<div class="absolute -top-8 left-6 bg-surface-container-high px-3 py-1 rounded-full text-xs font-label-ui text-on-surface opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-sm">Horizontal Scaling</div>
<button class="w-[80px] h-[80px] rounded-full bg-secondary-fixed-dim border-b-8 border-[#75b022] active:border-b-0 active:translate-y-2 flex items-center justify-center transition-all shadow-lg hover:brightness-110">
<span class="material-symbols-outlined text-4xl text-on-secondary" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
<!-- Lesson 3: Load Balancing (Active) -->
<div class="w-full flex justify-end pr-8 relative group cursor-pointer">
<div class="absolute -top-10 right-2 bg-primary-container text-on-primary px-4 py-2 rounded-xl text-sm font-label-ui whitespace-nowrap shadow-md">Load Balancing</div>

<span class="material-symbols-outlined text-4xl text-outline" style="font-variation-settings: 'FILL' 1;">lock</span>
