<style>
        body { font-family: 'Inter', sans-serif; }

            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        .path-line {
            position: absolute;
            width: 8px;
            z-index: 0;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- Header Section -->
<header class="sticky top-0 z-10 bg-background/90 backdrop-blur-md pt-6 pb-4 px-4 border-b border-surface-variant flex flex-col gap-4">

</div>
</div>

<!-- Lesson 1: Completed -->
<div class="relative w-full flex justify-center group">
<div class="path-line bg-secondary h-24 top-full"></div>
<button class="relative z-10 w-20 h-20 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-lg transform transition-transform hover:scale-105 ml-[-40px]">
<span class="material-symbols-outlined text-[40px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<div class="absolute left-1/2 ml-4 top-1/2 -translate-y-1/2 whitespace-nowrap">
<h3 class="font-label-ui text-on-surface">Fundamentals</h3>
</div>
</div>
<!-- Lesson 2: Completed -->
<div class="relative w-full flex justify-center group">
<div class="path-line bg-secondary h-24 top-full"></div>

<span class="material-symbols-outlined text-[40px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</button>

</div>
</div>
<!-- Lesson 3: Active -->
<div class="relative w-full flex justify-center group">
<div class="path-line bg-surface-variant h-24 top-full"></div>
<div class="relative z-10 w-24 h-24 ml-[-20px]">

<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-variant" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-secondary transition-all duration-1000" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="283" stroke-dashoffset="140" stroke-width="8"></circle>
</svg>
<button class="absolute inset-2 bg-on-surface text-surface rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.2)] pulse-glow transform transition-transform hover:scale-105">
<span class="material-symbols-outlined text-[40px]" data-icon="play_arrow" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<div class="absolute left-1/2 ml-10 top-1/2 -translate-y-1/2 whitespace-nowrap">
<h3 class="font-label-ui text-on-surface text-lg">Load Balancing</h3>
</div>
</div>
<!-- Lesson 4: Locked -->
<div class="relative w-full flex justify-center group">
<div class="path-line bg-surface-variant h-24 top-full"></div>
<button class="relative z-10 w-20 h-20 rounded-full bg-surface-variant text-outline flex items-center justify-center ml-[20px] cursor-not-allowed">
<span class="material-symbols-outlined text-[32px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>

</button>
