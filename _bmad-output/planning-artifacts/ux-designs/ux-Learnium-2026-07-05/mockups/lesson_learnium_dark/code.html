<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Learnium - Active Lesson</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary-container": "#3a2200",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#102000",
                        "on-primary-fixed-variant": "#354958",
                        "surface-tint": "#4c6171",
                        "primary-container": "#142937",
                        "on-primary-container": "#7c91a2",
                        "on-secondary-fixed-variant": "#304f00",
                        "surface-container-low": "#f1f3fb",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "background": "#f8f9ff",
                        "outline": "#73777c",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#acf847",
                        "on-primary-fixed": "#071e2b",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d7dae1",
                        "surface-container-highest": "#e0e2ea",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-container-high": "#e5e8f0",
                        "surface-container": "#ebeef5",
                        "secondary": "#416900",
                        "on-surface": "#181c21",
                        "on-tertiary-container": "#c77e00",
                        "on-secondary-container": "#457000",
                        "primary": "#001421",
                        "on-surface-variant": "#43474b",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e2ea",
                        "outline-variant": "#c3c7cc",
                        "primary-fixed-dim": "#b4c9dc",
                        "inverse-on-surface": "#eef1f8",
                        "tertiary-fixed": "#ffddb8",
                        "tertiary": "#1e0f00",
                        "secondary-container": "#acf847",
                        "on-tertiary": "#ffffff",
                        "on-background": "#181c21",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#2a1700",
                        "surface": "#000000", /* Override for pure black */
                        "primary-fixed": "#d0e5f8",
                        "inverse-primary": "#b4c9dc",
                        "inverse-surface": "#2d3136",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#91db2a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "12px",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "md": "16px",
                        "sm": "12px",
                        "xl": "32px",
                        "xs": "8px",
                        "xxl": "48px",
                        "base": "4px",
                        "lg": "24px",
                        "gutter": "24px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Space Grotesk"],
                        "display-lg-mobile": ["Bricolage Grotesque"],
                        "display-lg": ["Bricolage Grotesque"],
                        "body-main": ["Inter"],
                        "headline-md": ["Bricolage Grotesque"],
                        "label-ui": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "data-tabular": ["18px", { "lineHeight": "1", "fontWeight": "700" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-main": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-ui": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000000;
            color: #ffffff;
        }
        .hairline-border {
            border: 1px solid #1C2530;
        }
        .progress-bar-fill {
            background-color: #84CC16;
            transition: width 0.3s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-main antialiased h-screen flex flex-col justify-between">
<!-- Header / Progress -->
<header class="w-full pt-margin-mobile px-margin-mobile md:px-lg max-w-container-max mx-auto">
<div class="flex items-center justify-between mb-sm">
<button aria-label="Close lesson" class="text-on-primary hover:text-outline transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="font-label-ui text-label-ui text-secondary-fixed">Lesson 3 of 5</div>
</div>
<div class="w-full h-base bg-[#1C2530] rounded-full overflow-hidden">
<div class="h-full progress-bar-fill rounded-full" style="width: 60%;"></div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile md:px-lg max-w-container-max mx-auto w-full py-xl">
<!-- Nova Mascot & Question -->
<div class="mb-xl flex flex-col items-center md:items-start text-center md:text-left">
<div class="w-16 h-16 mb-md flex items-center justify-center rounded-lg bg-[#1C2530] border border-outline-variant/20 shadow-[0_0_20px_rgba(132,204,22,0.1)]">
<!-- Mascot (Nova - Geometric North Star) -->
<svg fill="none" height="32" stroke="#84CC16" stroke-linecap="square" stroke-linejoin="miter" stroke-width="1.5" viewbox="0 0 24 24" width="32">
<path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path>
</svg>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-primary mb-sm leading-tight">
                Which of these is NOT a valid CAP theorem trade-off?
            </h1>
<p class="font-body-main text-body-main text-outline w-full md:max-w-2xl">
                Come on, think. You can only pick two. Don't invent a third law of thermodynamics here.
            </p>
</div>
<!-- Options (Bento-ish Grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm w-full">
<button class="group hairline-border rounded-lg p-lg text-left hover:border-secondary-fixed hover:bg-primary-container transition-all duration-200 relative overflow-hidden flex flex-col h-full justify-between min-h-[120px]">
<div class="font-label-ui text-label-ui text-outline mb-xs uppercase tracking-widest">Option A</div>
<div class="font-data-tabular text-data-tabular text-on-primary group-hover:text-secondary-fixed transition-colors">
                    Consistency &amp; Availability
                </div>
<div class="absolute inset-0 border-2 border-secondary-fixed rounded-lg opacity-0 group-focus:opacity-100 transition-opacity"></div>
</button>
<button class="group hairline-border rounded-lg p-lg text-left hover:border-secondary-fixed hover:bg-primary-container transition-all duration-200 relative overflow-hidden flex flex-col h-full justify-between min-h-[120px]">
<div class="font-label-ui text-label-ui text-outline mb-xs uppercase tracking-widest">Option B</div>
<div class="font-data-tabular text-data-tabular text-on-primary group-hover:text-secondary-fixed transition-colors">
                    Availability &amp; Partition Tolerance
                </div>
<div class="absolute inset-0 border-2 border-secondary-fixed rounded-lg opacity-0 group-focus:opacity-100 transition-opacity"></div>
</button>
<button class="group hairline-border rounded-lg p-lg text-left hover:border-secondary-fixed hover:bg-primary-container transition-all duration-200 relative overflow-hidden flex flex-col h-full justify-between min-h-[120px]">
<div class="font-label-ui text-label-ui text-outline mb-xs uppercase tracking-widest">Option C</div>
<div class="font-data-tabular text-data-tabular text-on-primary group-hover:text-secondary-fixed transition-colors">
                    Consistency &amp; Partition Tolerance
                </div>
<div class="absolute inset-0 border-2 border-secondary-fixed rounded-lg opacity-0 group-focus:opacity-100 transition-opacity"></div>
</button>
<button class="group hairline-border rounded-lg p-lg text-left hover:border-secondary-fixed hover:bg-primary-container transition-all duration-200 relative overflow-hidden flex flex-col h-full justify-between min-h-[120px]">
<div class="font-label-ui text-label-ui text-outline mb-xs uppercase tracking-widest">Option D</div>
<div class="font-data-tabular text-data-tabular text-on-primary group-hover:text-secondary-fixed transition-colors">
                    Latency &amp; Consistency
                </div>
<div class="absolute inset-0 border-2 border-secondary-fixed rounded-lg opacity-0 group-focus:opacity-100 transition-opacity"></div>
</button>
</div>
</main>
<!-- Footer -->
<footer class="w-full px-margin-mobile pb-margin-mobile md:px-lg md:pb-lg max-w-container-max mx-auto">
<button class="w-full bg-white text-black font-label-ui text-label-ui py-lg rounded-lg uppercase tracking-wider hover:bg-surface-dim transition-colors active:scale-[0.98] duration-150">
            Continue
        </button>
</footer>
<script>
        // Simple micro-interaction for option selection
        const buttons = document.querySelectorAll('main button');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset all
                buttons.forEach(b => {
                    b.classList.remove('border-secondary-fixed', 'bg-primary-container');
                    b.classList.add('hairline-border');
                });
                // Highlight selected
                btn.classList.remove('hairline-border');
                btn.classList.add('border-secondary-fixed', 'bg-primary-container');
            });
        });
    </script>
</body></html>
