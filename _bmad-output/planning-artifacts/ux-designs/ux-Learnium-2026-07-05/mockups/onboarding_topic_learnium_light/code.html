<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom styles for chips interaction */
        .chip-checkbox:checked + label {
            background-color: theme('colors.primary');
            color: theme('colors.on-primary');
            border-color: theme('colors.primary');
        }
        .chip-checkbox:checked + label span.add-icon {
            display: none;
        }
        .chip-checkbox:checked + label span.check-icon {
            display: inline-block;
        }
        .check-icon {
            display: none;
        }
    </style>

<body class="bg-surface-container-lowest text-on-surface font-body-main text-body-main min-h-screen flex flex-col selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Progress Indicator (Minimalist) -->
<div class="w-full h-1 bg-surface-variant fixed top-0 z-50">
<div class="h-full w-1/4 bg-primary transition-all duration-500 ease-out"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile md:px-gutter max-w-container-max mx-auto w-full pt-xxl pb-xxl relative">
<!-- Header Section -->
<header class="mb-xl md:mb-xxl flex flex-col items-start gap-md">
<div class="flex items-center gap-sm">
<img alt="Learnium Nova Mascot" class="w-12 h-12 md:w-16 md:h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtQkp1rw6D1TiQYd9kKBvMbev7SVmNprc5P_woFbRRJ0bKrsNejFem8m2FXrcokJ_So9ISrkkaK469DoqNjsgsnGMr0hF59Z8e63-LEAYIpik89rA3ETqECBh6Lr1zBTpUX4sHAbACbyRJR7S64nVU5zFhotxREyvRzz7BGmQogBEK1AzjgkpirjoWDfzv9w8zsjB-MpWRTXVg7gvwusoFZ_Kz4dkr_ZtcfACOEPH_7d76yLpFRI7yktTE"/>
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tighter">Learnium</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary max-w-2xl mt-sm">
                What do you actually want to learn?
            </h1>
<p class="text-on-surface-variant font-body-main text-body-main md:text-lg max-w-xl">
                Skip the fluff. Tell us your focus, and we'll build a curriculum that respects your time.
            </p>
</header>
<!-- Input Section -->
<section class="w-full max-w-2xl mb-xl">
<div class="relative group">
<label class="sr-only" for="topic-input">Enter a topic</label>
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">search</span>
</div>
<input autocomplete="off" class="w-full bg-surface-container-lowest border border-outline hover:border-primary focus:border-primary focus:ring-1 focus:ring-primary text-on-surface rounded-DEFAULT py-md pl-xl pr-md font-body-main text-body-main transition-all placeholder:text-outline shadow-sm" id="topic-input" placeholder="e.g. Behavioral economics, Machine Learning..." type="text"/>
<div class="absolute inset-y-0 right-0 pr-xs flex items-center">
<button aria-label="Add topic" class="bg-primary text-on-primary rounded p-xs opacity-0 group-focus-within:opacity-100 transition-opacity hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">arrow_forward</span>
</button>
</div>
</div>
</section>
<!-- Suggestions Section -->
<section class="w-full max-w-3xl">
<h2 class="font-label-ui text-label-ui text-on-surface-variant uppercase tracking-wider mb-md">Popular Paths</h2>
<div class="flex flex-wrap gap-sm">
<!-- Chip 1 -->
<div>
<input class="chip-checkbox sr-only" id="chip-1" type="checkbox"/>
<label class="cursor-pointer inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-ui text-label-ui hover:border-primary transition-colors select-none" for="chip-1">
<span class="material-symbols-outlined text-[16px] add-icon">add</span>
<span class="material-symbols-outlined text-[16px] check-icon" data-weight="fill">check</span>
                        Behavioral economics
                    </label>
</div>
<!-- Chip 2 -->
<div>
<input class="chip-checkbox sr-only" id="chip-2" type="checkbox"/>
<label class="cursor-pointer inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-ui text-label-ui hover:border-primary transition-colors select-none" for="chip-2">
<span class="material-symbols-outlined text-[16px] add-icon">add</span>
<span class="material-symbols-outlined text-[16px] check-icon" data-weight="fill">check</span>
                        SQL fundamentals
                    </label>
</div>
<!-- Chip 3 -->
<div>
<input class="chip-checkbox sr-only" id="chip-3" type="checkbox"/>
<label class="cursor-pointer inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-ui text-label-ui hover:border-primary transition-colors select-none" for="chip-3">
<span class="material-symbols-outlined text-[16px] add-icon">add</span>
<span class="material-symbols-outlined text-[16px] check-icon" data-weight="fill">check</span>
                        Options trading
                    </label>
</div>
<!-- Chip 4 -->
<div>
<input class="chip-checkbox sr-only" id="chip-4" type="checkbox"/>
<label class="cursor-pointer inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-ui text-label-ui hover:border-primary transition-colors select-none" for="chip-4">
<span class="material-symbols-outlined text-[16px] add-icon">add</span>
<span class="material-symbols-outlined text-[16px] check-icon" data-weight="fill">check</span>
                        Systems thinking
                    </label>
</div>
</div>
</section>
</main>
<!-- Bottom Actions (Sticky on Mobile) -->
<div class="fixed md:static bottom-0 left-0 w-full p-margin-mobile md:px-gutter md:pb-xl bg-surface-container-lowest md:bg-transparent border-t border-outline-variant md:border-t-0 z-40 max-w-container-max mx-auto md:mt-auto">
<button class="w-full md:w-auto md:min-w-[200px] md:float-right bg-primary text-on-primary font-label-ui text-label-ui py-sm px-xl rounded-DEFAULT flex items-center justify-center gap-sm hover:bg-primary-container transition-colors active:scale-95 shadow-sm">
            Continue
            <span class="material-symbols-outlined" data-weight="fill">arrow_forward</span>
</button>
</div>
<!-- Decorative background element to break pure white -->
<div class="fixed top-0 right-0 w-64 h-64 bg-primary-fixed opacity-[0.15] blur-3xl rounded-full -translate-y-1/2 translate-x-1/4 pointer-events-none -z-10"></div>
<div class="fixed bottom-0 left-0 w-96 h-96 bg-secondary-fixed opacity-[0.05] blur-3xl rounded-full translate-y-1/3 -translate-x-1/3 pointer-events-none -z-10"></div>
<script>
        // Simple interaction for input field to mock selection
        const input = document.getElementById('topic-input');
        const submitBtn = input.nextElementSibling.querySelector('button');
        
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                // Mock action: visually confirm input
                this.blur();
                this.style.borderColor = 'var(--tw-colors-secondary-fixed-dim)';
                setTimeout(() => {
                    this.style.borderColor = '';
                }, 500);
            }
        });

        submitBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (input.value.trim() !== '') {
                input.blur();
                input.style.borderColor = 'var(--tw-colors-secondary-fixed-dim)';
                setTimeout(() => {
                    input.style.borderColor = '';
                }, 500);
            }
        });
    </script>
</body></html>
