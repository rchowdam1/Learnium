<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-margin-mobile font-body-main text-on-surface">
<main class="w-full max-w-[440px] bg-surface-container-lowest flex flex-col items-center">
<!-- Logo -->
<div class="mb-lg flex justify-center">
<img alt="Learnium Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtQkp1rw6D1TiQYd9kKBvMbev7SVmNprc5P_woFbRRJ0bKrsNejFem8m2FXrcokJ_So9ISrkkaK469DoqNjsgsnGMr0hF59Z8e63-LEAYIpik89rA3ETqECBh6Lr1zBTpUX4sHAbACbyRJR7S64nVU5zFhotxREyvRzz7BGmQogBEK1AzjgkpirjoWDfzv9w8zsjB-MpWRTXVg7gvwusoFZ_Kz4dkr_ZtcfACOEPH_7d76yLpFRI7yktTE"/>
</div>
<!-- Header -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Welcome back</h1>
<p class="font-body-main text-body-main text-on-surface-variant">Log in to continue your learning journey.</p>
</div>
<!-- Form -->
<form class="w-full flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-ui text-label-ui text-on-surface" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-md py-sm font-body-main text-body-main text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-ui text-label-ui text-on-surface" for="password">Password</label>
<a class="font-label-ui text-label-ui text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-md py-sm font-body-main text-body-main text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary border border-primary-container rounded py-sm px-md font-label-ui text-label-ui hover:bg-primary transition-colors mt-xs flex justify-center items-center gap-xs" type="submit">
                Log in
            </button>
<!-- Divider -->
<div class="relative flex items-center my-md">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-md font-label-ui text-label-ui text-on-surface-variant">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Google Login -->
<button class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded py-sm px-md font-label-ui text-label-ui hover:border-primary hover:text-primary transition-colors flex justify-center items-center gap-sm" type="button">
<!-- Google 'G' Icon Placeholder (Simple SVG for styling purposes, replace with actual if needed, but per strict rules avoiding complex raw SVG if possible, using text representation or simple shapes if generic) -->

            </button>
</form>
