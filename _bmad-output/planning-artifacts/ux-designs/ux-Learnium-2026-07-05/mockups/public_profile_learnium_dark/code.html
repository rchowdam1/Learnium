<style>
        body {
            /* Forcing pure black background as requested in prompt despite dark mode theme colors */
            background-color: #000000; 
            color: #ffffff;
        }
        /* Custom progress ring styling */
        .progress-ring circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-main antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full sticky top-0 bg-[#000000] border-b border-outline-variant/30 flex justify-between items-center px-margin-mobile py-sm z-50">
<button class="text-on-primary hover:bg-surface-variant/20 transition-colors p-xs rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-primary">Public Profile</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile py-lg max-w-[600px] mx-auto w-full gap-xl">
<!-- Profile Section -->
<section class="flex flex-col items-center justify-center gap-md">
<div class="relative">
<img class="w-32 h-32 rounded-full object-cover border border-outline-variant/50" data-alt="A striking portrait of a professional individual serving as an avatar, rendered in a sleek, high-contrast style suited for a modern tech interface. The subject is well-lit with high-key lighting, standing out against a deep, pure black background. Subtle, vibrant accents of lime green and amber catch the edge of the subject, reinforcing a premium, grown-up gamified aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAiN4lhCOfwiiifuzk4aAd2DGoepEZkWAPPTG-Kj3klBpAUkwjO3kGz4xBr75HDM1l6MKI-aDGcE7Ih6kr7zu4iBr6Y06iWmkjAcDph1F9cOqbQo9htgj-UHAltjSAQerzXXN9BnETy7BbckNADa4E9kuqQ25ojMR9_bktKoxY3Q8kUnhgx4AW5MPHwEy7CHhXlHhUIXaf9ZUkgaGCY5yr93W2XTqL6YpP4q4G-rgRWyJliwNR0Ha9h"/>
<!-- Level Badge with Progress Ring -->
<div class="absolute -bottom-2 -right-2 bg-primary rounded-full w-12 h-12 flex items-center justify-center border-2 border-[#000000] relative">
<svg class="progress-ring absolute inset-0 w-full h-full -rotate-90 transform" height="48" width="48">
<!-- Background track -->
<circle cx="24" cy="24" fill="transparent" r="22.5" stroke="rgba(172, 248, 71, 0.2)" stroke-width="3"></circle>
<!-- Progress indicator (approx 75%) -->
<circle cx="24" cy="24" fill="transparent" r="22.5" stroke="#acf847" stroke-dasharray="141.37" stroke-dashoffset="35.34" stroke-width="3"></circle>
</svg>
<span class="font-data-tabular text-data-tabular text-on-primary absolute z-10">6</span>
</div>
</div>
<div class="text-center">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-primary">Alex Mercer</h2>
<p class="font-label-ui text-label-ui text-on-primary-container mt-xs">Data Science Track</p>
</div>
</section>
<!-- Stats Bento Grid -->
<section class="grid grid-cols-2 gap-md">
<!-- Streak Stat -->
<div class="bg-[#111111] border border-outline-variant/30 rounded-lg p-md flex flex-col items-center justify-center gap-xs">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-3xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-data-tabular text-[32px] leading-none font-bold text-on-primary">12</span>
<span class="font-label-ui text-label-ui text-on-primary-container uppercase tracking-wider">Day Streak</span>
</div>
<!-- Sets Completed Stat -->
<div class="bg-[#111111] border border-outline-variant/30 rounded-lg p-md flex flex-col items-center justify-center gap-xs">
<span class="material-symbols-outlined text-secondary-fixed text-3xl" style="font-variation-settings: 'FILL' 1;">view_cozy</span>
<span class="font-data-tabular text-[32px] leading-none font-bold text-on-primary">24</span>
<span class="font-label-ui text-label-ui text-on-primary-container uppercase tracking-wider">Sets Done</span>
</div>
</section>
<!-- Actions -->
<section class="flex flex-col gap-sm w-full">
<button class="w-full bg-on-primary text-[#000000] font-label-ui text-label-ui py-sm rounded px-md flex items-center justify-center gap-xs hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">person_add</span>
                Follow
            </button>
<button class="w-full bg-transparent border border-outline-variant/50 text-on-primary font-label-ui text-label-ui py-sm rounded px-md flex items-center justify-center gap-xs hover:border-on-primary transition-colors">
<span class="material-symbols-outlined text-lg">share</span>
                Share Profile
            </button>
</section>
<!-- Top Badges Section -->
<section class="flex flex-col gap-md">
<h3 class="font-headline-md text-[20px] font-bold text-on-primary">Top Badges</h3>
<div class="grid grid-cols-3 gap-sm">
<!-- Badge 1 -->
<div class="bg-[#111111] border border-outline-variant/30 rounded-lg p-sm flex flex-col items-center justify-center aspect-square gap-xs">
<span class="material-symbols-outlined text-secondary-fixed text-4xl" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
<span class="font-label-ui text-[10px] text-center text-on-primary-container">Python Pro</span>
</div>
<!-- Badge 2 -->
<div class="bg-[#111111] border border-outline-variant/30 rounded-lg p-sm flex flex-col items-center justify-center aspect-square gap-xs">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-4xl" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-label-ui text-[10px] text-center text-on-primary-container">Deep Thinker</span>
</div>
<!-- Badge 3 -->
<div class="bg-[#111111] border border-outline-variant/30 rounded-lg p-sm flex flex-col items-center justify-center aspect-square gap-xs">
<span class="material-symbols-outlined text-[#a3defe] text-4xl" style="font-variation-settings: 'FILL' 1;">speed</span>
<span class="font-label-ui text-[10px] text-center text-on-primary-container">Fast Learner</span>
</div>
</div>
</section>
</main>
<!-- Navigation suppressed as this is a transactional/focused view with a 'back' action -->
</body></html>
