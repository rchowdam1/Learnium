name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Required environment variables for build/tests
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY || 'dummy-anon-key' }}
      # Mocking Stripe API key and OpenAI API key if needed for build/tests
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_dummy' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-proj-dummy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run Unit/Integration Tests
        run: npm run test

      - name: Run E2E Smoke Tests
        run: npm run test:e2e
